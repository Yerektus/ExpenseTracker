<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💰</text></svg>" />
    <title>Expense Tracker</title>
    <script>
      // Применяем сохранённую тему до загрузки React, чтобы страница не «мигала» светлой темой.
      // Ключ и логика совпадают с хуком useTheme из HeroUI (localStorage "heroui-theme").
      (function () {
        try {
          var stored = localStorage.getItem("heroui-theme") || "system";
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = stored === "dark" || (stored === "system" && prefersDark) ? "dark" : "light";
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute("data-theme", theme);
        } catch (error) {
          // localStorage недоступен — тему выставит useTheme после загрузки.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
